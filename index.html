// ===== STATE =====
const selectedProductsByCategory = {};
const shelfReportData = [];
const promoData = {};

dateTime.value = new Date().toLocaleString();

// ===== LOCATION =====
function captureLocation(){
navigator.geolocation.getCurrentPosition(p=>{
gps.value = p.coords.latitude+","+p.coords.longitude;
});
}

// ===== ACCOUNT =====
account.innerHTML = `<option>Select Account</option>`;
[...new Set(outlets.map(x=>x.account))].forEach(a=>{
account.innerHTML+=`<option>${a}</option>`;
});

account.onchange=()=>{
const acc=account.value;

outlet.innerHTML='';
outlets.filter(x=>x.account===acc).forEach(x=>{
outlet.innerHTML+=`<option>${x.name}</option>`;
});

category.innerHTML='';
shelfCategory.innerHTML='';

[...new Set(skuMaster.filter(x=>x.account===acc).map(x=>x.category))]
.forEach(c=>{
category.innerHTML+=`<option>${c}</option>`;
shelfCategory.innerHTML+=`<option>${c}</option>`;
});

loadProducts();
loadPromo();
};

// ===== PRODUCTS =====
function loadProducts(){
const list=skuMaster.filter(x=>x.account===account.value && x.category===category.value);
productList.innerHTML='';

list.forEach(p=>{
const checked=(selectedProductsByCategory[category.value]||[]).includes(p.skuName);
productList.innerHTML+=`
<label class="flex items-center gap-2 bg-gray-50 p-2 rounded mb-1">
<input type="checkbox" value="${p.skuName}" ${checked?"checked":""}
onchange="updateSel()">
<span class="text-sm">${p.skuName}</span>
</label>`;
});

calcAvailability();
}

category.onchange=loadProducts;

function updateSel(){
selectedProductsByCategory[category.value]=
[...document.querySelectorAll("#productList input:checked")].map(x=>x.value);
calcAvailability();
updateRating();
}

function calcAvailability(){
const t=document.querySelectorAll("#productList input").length;
const s=document.querySelectorAll("#productList input:checked").length;
availabilityPct.innerText=t?((s/t)*100).toFixed(1):0;
}

// ===== SOS =====
function addShelf(){

const total = Number(totalFacings.value);
const ours = Number(ourFacings.value);
const cat = shelfCategory.value;
const eye = eyeLevel.value || "";
const addVis = Number(additionalVisibility.value) || 0;

if(!cat || !total){
alert("Enter valid data");
return;
}

const pct = ((ours/total)*100).toFixed(1);

const idx = shelfReportData.findIndex(x=>x.category===cat);

const row = {
category: cat,
totalFacings: total,
ourFacings: ours,
sharePct: pct,
eyeLevel: eye,
additionalVisibility: addVis
};

if(idx>=0) shelfReportData[idx] = row;
else shelfReportData.push(row);

renderShelf();
updateRating();

// 🔁 reset all SOS inputs
totalFacings.value = "";
ourFacings.value = "";
shelfCategory.selectedIndex = 0;
eyeLevel.selectedIndex = 0;
additionalVisibility.value = "";
}
function renderShelf(){
shelfTableBody.innerHTML='';
shelfReportData.forEach(r=>{
shelfTableBody.innerHTML+=`
<tr>
<td class="border p-1">${r.category}</td>
<td class="border p-1">${r.totalFacings}</td>
<td class="border p-1">${r.ourFacings}</td>
<td class="border p-1">${r.sharePct}%</td>
<td class="border p-1">${r.eyeLevel || ""}</td>
<td class="border p-1">${r.additionalVisibility || ""}</td>
</tr>`;
});
}
// ===== PROMO =====
function loadPromo(){

const promos=promoMaster.filter(x=>x.account===account.value);

if(!promos.length){
promoSection.style.display="none";
return;
}

promoSection.style.display="block";
promoList.innerHTML='';

promos.forEach(p=>{

const saved=promoData[p.skuCode]||{};
let status="-",color="black";

if(saved.price){
if(saved.price<=p.promoPrice){status="Running";color="green";}
else{status="Not Running";color="red";}
}

promoList.innerHTML+=`
<div class="bg-gray-50 border p-3 rounded">
<div class="font-medium">${p.skuName}</div>

<div class="grid grid-cols-2 gap-2 mt-2">
<input type="number" inputmode="numeric" placeholder="Selling Price"
value="${saved.price||""}"
oninput="updatePromo('${p.skuCode}',this.value)"
class="border p-2 rounded">

<select onchange="updateTalker('${p.skuCode}',this.value)"
class="border p-2 rounded">
<option value="">Talker</option>
<option ${saved.talker==="Yes"?"selected":""}>Yes</option>
<option ${saved.talker==="No"?"selected":""}>No</option>
</select>
</div>

<div class="text-xs mt-2">MRP ₹${p.mrp} | Discount ₹${p.discount}</div>
<div class="text-sm mt-1">Status:
<span id="s-${p.skuCode}" style="color:${color};font-weight:600">${status}</span>
</div>
</div>`;
});

updatePromoSummary();
}

function updatePromo(code,val){
if(!promoData[code]) promoData[code]={};

const price=Number(val);
promoData[code].price=price;

const p=promoMaster.find(x=>x.skuCode===code);
const el=document.getElementById("s-"+code);

if(!price){el.innerText="-";el.style.color="black";return;}

if(price<=p.promoPrice){
el.innerText="Running";el.style.color="green";
}else{
el.innerText="Not Running";el.style.color="red";
}

updatePromoSummary();
  updateRating();
}

function updateTalker(code,val){
if(!promoData[code]) promoData[code]={};
promoData[code].talker=val;
  updateRating();
}

function updatePromoSummary(){
const promos=promoMaster.filter(x=>x.account===account.value);

let ok=0;
promos.forEach(p=>{
const d=promoData[p.skuCode];
if(d && d.price<=p.promoPrice) ok++;
});

promoPct.innerText=promos.length?((ok/promos.length)*100).toFixed(1):0;
}

function getPromoTalkerScore(){

const promos = promoMaster.filter(x=>x.account===account.value);
if(!promos.length) return 2;

let score = 0;

promos.forEach(p=>{
const d = promoData[p.skuCode];

if(d && d.price && d.price <= p.promoPrice){
score += 1; // promo running

if(d.talker === "Yes") score += 1; // talker present
}
});

// max possible = 2 * promos.length
const pct = promos.length ? (score / (promos.length * 2)) : 0;

return pct * 2; // out of 2
}

function getEyeLevelScore(){

if(!shelfReportData.length) return 0;

let count = 0;

shelfReportData.forEach(r=>{
if(r.eyeLevel === "Yes") count++;
});

const pct = count / shelfReportData.length;

return pct * 2; // out of 2
}

function getVisibilityScore(){

if(!shelfReportData.length) return 0;

let total = 0;

shelfReportData.forEach(r=>{
total += Number(r.additionalVisibility) || 0;
});

// define max benchmark (tunable)
const MAX_VISIBILITY = 10;

const pct = Math.min(total / MAX_VISIBILITY, 1);

return pct * 1; // out of 1
}

// ===== RATING =====
function updateRating(){

let a=0,c=0;

Object.keys(selectedProductsByCategory).forEach(cat=>{
const all=skuMaster.filter(x=>x.account===account.value && x.category===cat);
const sel=selectedProductsByCategory[cat]||[];
if(all.length){a+=(sel.length/all.length)*100;c++;}
});

const avgA=c?a/c:0;

let s=0;
shelfReportData.forEach(x=>s+=parseFloat(x.sharePct));
const avgS=shelfReportData.length?s/shelfReportData.length:0;

// ===== NEW WEIGHTED LOGIC =====
const availabilityScore = (avgA/100) * 2.5;
const sosScore = (avgS/100) * 2.5;
const promoScore = getPromoTalkerScore();
const eyeScore = getEyeLevelScore();
const visScore = getVisibilityScore();

let final = availabilityScore + sosScore + promoScore + eyeScore + visScore;

// cap
final = Math.min(final, 10);

rating.innerText = final.toFixed(1);

// ===== LABEL =====
updateRatingLabel(final);
}

function updateRatingLabel(score){

let label = "";
let color = "";

if(score >= 9){
label = "Excellent";
color = "green";
}
else if(score >= 7){
label = "Good";
color = "blue";
}
else if(score >= 4){
label = "Average";
color = "orange";
}
else{
label = "Poor";
color = "red";
}

ratingLabel.innerText = label;
ratingLabel.style.color = color;
}

// ===== FILE NAME =====
function getFileName(){
const d=new Date().toISOString().split('T')[0];
return `${account.value} - ${outlet.value} - ${intern.value} - ${d}.xlsx`;
}

// ===== EXCEL =====
function createWorkbook(){

const wb=XLSX.utils.book_new();

// SUMMARY
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{
Account:account.value,Outlet:outlet.value,Intern:intern.value,
Date:dateTime.value,GPS:gps.value,Rating:rating.innerText
}]),"Summary");

// AVAILABILITY
const avail=[];
Object.keys(selectedProductsByCategory).forEach(cat=>{
const all=skuMaster.filter(x=>x.account===account.value && x.category===cat);
const sel=selectedProductsByCategory[cat]||[];
avail.push({
Category:cat,
Available:sel.join(", "),
AvailabilityPercent:all.length?((sel.length/all.length)*100).toFixed(1):0
});
});
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(avail),"Availability");

// NOT AVAILABLE
// ===== NOT AVAILABLE (UPDATED FORMAT)
const na=[];
Object.keys(selectedProductsByCategory).forEach(cat=>{
const all=skuMaster.filter(x=>x.account===account.value && x.category===cat);
const sel=selectedProductsByCategory[cat]||[];

all.forEach(s=>{
if(!sel.includes(s.skuName)){
na.push({
Account: account.value,
StoreName: outlet.value,
Date: dateTime.value,
Category: cat,
SKUCode: s.skuCode,
SKUName: s.skuName
});
}
});
});

XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(na),"Not Available SKUs");

// SOS
const sosRows = shelfReportData.map(r=>({
Account: account.value,
StoreName: outlet.value,
Date: dateTime.value,
Category: r.category,
TotalFacings: r.totalFacings,
OurFacings: r.ourFacings,
SharePercent: r.sharePct,
EyeLevel: r.eyeLevel || "",
AdditionalVisibilities: r.additionalVisibility || 0
}));

XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sosRows), "SOS Check");

// PROMO
// ===== PROMO CHECK (UPDATED FORMAT)
const promoRows=[];

promoMaster
.filter(x=>x.account===account.value)
.forEach(p=>{

const d=promoData[p.skuCode]||{};
const sell=Number(d.price)||0;
const expected=p.promoPrice;

// category mapping
const catObj = skuMaster.find(x=>x.skuCode===p.skuCode);
const category = catObj ? catObj.category : "";

let contribution=0;
let contributionPct=0;

if(sell && sell<expected){
contribution = expected - sell;
contributionPct = ((contribution / p.mrp) * 100).toFixed(2);
}

promoRows.push({
Account: account.value,
StoreName: outlet.value,
Date: dateTime.value,
Category: category,
SKUCode: p.skuCode,
SKUName: p.skuName,
MRP: p.mrp,
PromoDiscount: p.discount,
SellingPrice: sell || "",
PromoStatus: sell ? (sell<=expected ? "Running" : "Not Running") : "",
Contribution: contribution,
ContributionPercent: contributionPct,
Talker: d.talker || ""
});

});

XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(promoRows),"Promo Check");

return wb;
}

// ===== BUTTONS =====
function downloadExcel(){ XLSX.writeFile(createWorkbook(), getFileName()); }
function shareExcel(){ downloadExcel(); alert("Downloaded. Share manually."); }

// ===== DRAFT =====
function saveDraft(){
localStorage.setItem("draft", JSON.stringify({
intern: intern.value,
account: account.value,
outlet: outlet.value,
category: category.value,
selectedProductsByCategory,
shelfReportData,
promoData
}));
alert("Saved");
}

function restoreDraft(){

const data = JSON.parse(localStorage.getItem("draft"));
if(!data) return;

// restore dropdowns first
intern.value = data.intern || "";
account.value = data.account || "";

// trigger account load (this populates outlet/category)
account.onchange();

// delay ensures dropdowns are ready
setTimeout(()=>{

outlet.value = data.outlet || "";
category.value = data.category || "";

// restore data
Object.assign(selectedProductsByCategory, data.selectedProductsByCategory || {});

shelfReportData.length = 0;
(data.shelfReportData || []).forEach(x => shelfReportData.push(x));

Object.assign(promoData, data.promoData || {});

// re-render
renderShelf();
loadProducts();
loadPromo();
updateRating();

}, 100);
}

function clearDraft(){
localStorage.removeItem("draft");
location.reload();
}

window.onload = function(){
restoreDraft();
};
