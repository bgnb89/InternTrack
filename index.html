<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Audit App - V4.6</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body class="bg-gray-100 pb-24">

<div class="max-w-5xl mx-auto bg-white p-4 rounded-xl shadow space-y-5">

<h2 class="text-xl font-bold text-center">Store Audit App</h2>

<select id="intern" class="border p-3 w-full rounded-lg">
<option value="">Select Intern</option>
<option>Sanjay</option>
<option>Ajay</option>
<option>Akshay</option>
<option>Abhiram</option>
<option>Hiba</option>
<option>Krishnendu</option>
<option>Megha</option>
</select>

<input id="dateTime" class="border p-3 w-full bg-gray-100 rounded-lg" readonly>

<select id="account" class="border p-3 w-full rounded-lg"></select>
<select id="outlet" class="border p-3 w-full rounded-lg"></select>

<input id="gps" class="border p-3 w-full bg-gray-100 rounded-lg" readonly>

<button onclick="captureLocation()" class="bg-blue-700 text-white w-full p-3 rounded-lg">
📍 Capture Location
</button>

<!-- AVAILABILITY -->
<select id="category" class="border p-3 w-full rounded-lg mt-3"></select>
<div id="productList" class="mt-2"></div>

<!-- SOS -->
<select id="shelfCategory" class="border p-3 w-full rounded-lg mt-3"></select>

<input id="totalFacings" type="number" inputmode="numeric" class="border p-3 w-full mt-2 rounded-lg" placeholder="Total Facings">
<input id="ourFacings" type="number" inputmode="numeric" class="border p-3 w-full mt-2 rounded-lg" placeholder="Our Facings">

<button onclick="addShelf()" class="bg-blue-600 text-white w-full p-3 mt-2 rounded-lg">
Add to Report
</button>

<table class="w-full border mt-3">
<tbody id="shelfTableBody"></tbody>
</table>

</div>

<!-- ACTION BAR -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex gap-2">
<button onclick="downloadExcel()" class="bg-green-600 text-white flex-1 p-3 rounded-lg">Download</button>
<button onclick="shareExcel()" class="bg-purple-600 text-white flex-1 p-3 rounded-lg">Share</button>
</div>

<script>

// ===== DATA =====
const outlets = [];
const skuMaster = [];

// ===== STATE =====
const selectedProductsByCategory = {};
const shelfReportData = [];

// ===== ELEMENTS =====
const accountSelect = document.getElementById("account");
const outletSelect = document.getElementById("outlet");
const categorySelect = document.getElementById("category");

// ===== INIT =====
document.getElementById("dateTime").value = new Date().toLocaleString();

function captureLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
gps.value = pos.coords.latitude+","+pos.coords.longitude;
});
}

// ===== ACCOUNT =====
accountSelect.innerHTML='<option>Select Account</option>';
[...new Set(outlets.map(x=>x.account))].forEach(a=>{
accountSelect.innerHTML+=`<option>${a}</option>`;
});

accountSelect.onchange=()=>{
const acc=accountSelect.value;

outletSelect.innerHTML='';
outlets.filter(x=>x.account===acc).forEach(x=>{
outletSelect.innerHTML+=`<option>${x.name}</option>`;
});

categorySelect.innerHTML='';
[...new Set(skuMaster.filter(x=>x.account===acc).map(x=>x.category))]
.forEach(c=>{
categorySelect.innerHTML+=`<option>${c}</option>`;
});

loadProducts();
};

categorySelect.onchange=loadProducts;

// ===== PRODUCTS =====
function loadProducts(){
const list=skuMaster.filter(x=>x.account===accountSelect.value && x.category===categorySelect.value);
productList.innerHTML='';
list.forEach(p=>{
const checked=(selectedProductsByCategory[categorySelect.value]||[]).includes(p.skuName);
productList.innerHTML+=`<label><input type="checkbox" value="${p.skuName}" ${checked?"checked":""} onchange="updateSel()"> ${p.skuName}</label><br>`;
});
}

function updateSel(){
selectedProductsByCategory[categorySelect.value]=[...document.querySelectorAll("#productList input:checked")].map(x=>x.value);
}

// ===== EXCEL =====
function buildAvailability(){
const rows=[];
Object.keys(selectedProductsByCategory).forEach(cat=>{
const sel=selectedProductsByCategory[cat]||[];
rows.push({
Account:accountSelect.value,
Outlet:outletSelect.value,
Category:cat,
Available:sel.join(", ")
});
});
return rows;
}

function buildNotAvailable(){
const rows=[];

Object.keys(selectedProductsByCategory).forEach(cat=>{
const all=skuMaster.filter(x=>x.account===accountSelect.value && x.category===cat);
const sel=selectedProductsByCategory[cat]||[];

all.forEach(sku=>{
if(!sel.includes(sku.skuName)){
rows.push({
Account:accountSelect.value,
Outlet:outletSelect.value,
SKUCode:sku.skuCode,
SKUName:sku.skuName
});
}
});
});

return rows;
}

function createWorkbook(){
const wb=XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(buildAvailability()),"Availability");
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(buildNotAvailable()),"Not Available SKUs");

return wb;
}

function downloadExcel(){
XLSX.writeFile(createWorkbook(),"StoreAudit.xlsx");
}

async function shareExcel(){
downloadExcel();
alert("Download complete. Share manually.");
}

</script>

</body>
</html>
